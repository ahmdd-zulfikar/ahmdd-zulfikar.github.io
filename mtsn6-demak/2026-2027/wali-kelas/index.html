<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wali Kelas 7A - Administrasi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        teal: {
                            850: '#0f5d56',
                            900: '#134e4a',
                            950: '#042f2e',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #f8fafc;
            color: #334155;
            /* To ensure the table fits, we force the page to not be too padded horizontally */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Modern Table Styles (Compact Mode to fit screen) */
        .modern-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            font-family: 'Inter', sans-serif;
            table-layout: fixed;
        }
        
        .modern-table th, .modern-table td {
            border-bottom: 1px solid #e2e8f0; /* slate-200 */
            border-right: 1px solid #e2e8f0;
            white-space: nowrap;
        }
        
        .modern-table th {
            background-color: #f8fafc; /* slate-50 */
            color: #475569; /* slate-600 */
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.65rem; /* ~10px */
            letter-spacing: 0.05em;
            padding: 4px 2px;
        }

        .modern-table tr:hover td:not(.holiday-cell) {
            background-color: #f0fdfa; /* teal-50 */
        }
        
        .info-row:hover th, .main-title-row:hover th {
            background-color: #ffffff;
        }

        .modern-table th:first-child, .modern-table td:first-child {
            border-left: 1px solid #e2e8f0;
        }
        .modern-table tr:first-child th {
            border-top: 1px solid #e2e8f0;
        }

        .main-title-row th {
            background-color: #ffffff;
            border: none !important;
            color: #0f766e; /* teal-700 */
            font-size: 1rem; /* slightly smaller to fit better */
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            padding: 12px 12px 4px 12px;
            text-transform: none;
            letter-spacing: normal;
        }

        .info-row th {
            background-color: #ffffff;
            border: none !important;
            text-transform: none;
            font-size: 0.75rem; /* 12px */
            color: #64748b; /* slate-500 */
            padding: 2px 12px;
            font-weight: 500;
            letter-spacing: normal;
        }
        
        .spacer-row th {
            background-color: #ffffff;
            border: none !important;
            padding: 4px;
        }

        .modern-table td.student-no {
            text-align: center;
            color: #94a3b8;
            font-weight: 500;
            font-size: 0.65rem;
            padding: 2px;
        }
        .modern-table td.student-name {
            font-weight: 500;
            color: #334155;
            font-size: 0.7rem; /* 11px */
            padding: 2px 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }

        .modern-input {
            width: 100%;
            height: 100%;
            border: 1px solid transparent;
            outline: none;
            background: transparent;
            text-align: center;
            font-size: 0.7rem;
            color: #334155;
            border-radius: 4px;
            transition: all 0.2s ease;
            padding: 2px;
        }

        .modern-input:hover:not(:disabled) {
            background-color: #e2e8f0; /* slate-200 */
        }

        .modern-input:focus {
            background-color: #ffffff;
            border-color: #0d9488;
            box-shadow: 0 0 0 1px rgba(13, 148, 136, 0.4);
        }

        /* Holiday overlay styling */
        .holiday-overlay {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
        }
        
        /* Remove number spinner in inputs */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-teal-200 selection:text-teal-900 bg-slate-50 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="w-full z-50 bg-white border-b border-slate-200 shadow-sm sticky top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-14">
                <a href="../" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                    <div class="w-7 h-7 rounded-lg bg-teal-600 flex items-center justify-center text-white">
                        <i class="fa-solid fa-users text-xs"></i>
                    </div>
                    <span class="font-heading font-bold text-base tracking-wide text-slate-800">Wali<span class="text-teal-600">Kelas</span></span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-[100%] mx-auto py-4 px-2 sm:px-4 w-full flex flex-col h-full">
        
        <div class="mb-4 bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-teal-50 text-teal-600 text-[10px] font-bold mb-2 border border-teal-100 tracking-wide">
                    <i class="fa-solid fa-chalkboard-user"></i> KELAS 7A
                </div>
                <h1 class="text-xl md:text-2xl font-bold text-slate-800 font-heading">Manajemen Kelas</h1>
                <p class="text-slate-500 mt-1 text-xs md:text-sm">Pencatatan Absensi, Tabungan, dan Infaq Harian Siswa</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-2 overflow-x-auto pb-2 mb-2" id="tabs">
            <!-- Tabs injected by JS -->
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col flex-grow">
            <!-- Use flex-grow so the table container fills available height, and overflow-x-auto for responsiveness (though we try to fit it) -->
            <div class="overflow-x-auto overflow-y-auto p-2" id="table-container">
                <!-- Tables injected here -->
            </div>

        </div>
    </main>

    <!-- Use module type to properly import dataSiswa -->
    <script type="module">
        import dataSiswa from '../data-siswa.js';
        
        const MAX_COLS = 31; // Now up to 31!
        
        window.showTab = function(tabId) {
            document.querySelectorAll('.table-section').forEach(el => el.classList.add('hidden'));
            document.getElementById('container-' + tabId).classList.remove('hidden');

            const tabs = ['presensi', 'tabungan', 'infaq'];
            tabs.forEach(id => {
                const btn = document.getElementById('tab-' + id);
                if (id === tabId) {
                    btn.className = "px-5 py-2 font-semibold rounded-lg shadow-sm font-sans transition-colors whitespace-nowrap bg-teal-600 text-white border border-teal-700 text-sm";
                } else {
                    btn.className = "px-5 py-2 font-semibold rounded-lg shadow-sm font-sans transition-colors whitespace-nowrap bg-white text-slate-600 hover:bg-slate-50 border border-slate-300 text-sm";
                }
            });
        };

        function createTableHTML(id, mainTitle, students) {
            const isKeuangan = id === 'infaq' || id === 'tabungan';
            const keuanganCols = 5; // 4 dates + 1 Jumlah
            const totalCols = isKeuangan ? keuanganCols : MAX_COLS;
            
            let html = `
                <div id="container-${id}" class="table-section hidden">
                    <table class="modern-table">
                        <!-- Column specifications to enforce fitting into screen -->
                        <colgroup>
                            <col style="width: 25px;"> <!-- No -->
                            <col style="width: 140px;"> <!-- Nama Siswa -->
            `;
            
            if (isKeuangan) {
                for (let i = 1; i <= keuanganCols; i++) html += `<col style="width: 80px;">`;
            } else {
                for (let i = 1; i <= MAX_COLS; i++) html += `<col style="width: 22px;">`;
            }
            
            html += `
                        </colgroup>
                        <thead>
                            <tr class="main-title-row">
                                <th colspan="${totalCols + 2}" class="text-center">
                                    ${mainTitle}
                                </th>
                            </tr>
                            <tr class="info-row">
                                <th colspan="${isKeuangan ? 3 : 5}" class="text-left">Kelas &nbsp;&nbsp;&nbsp;&nbsp;: VII A</th>
                                <th colspan="${isKeuangan ? 4 : 28}" class="text-right">
                                    <div class="inline-block text-left w-[230px]">Tahun Ajaran &nbsp;: 2026/2027</div>
                                </th>
                            </tr>
                            <tr class="info-row">
                                <th colspan="${isKeuangan ? 3 : 5}" class="text-left">${id === 'presensi' ? 'Bulan &nbsp;&nbsp;&nbsp;&nbsp;: Juni' : 'Bulan &nbsp;&nbsp;&nbsp;&nbsp;: Juli'}</th>
                                <th colspan="${isKeuangan ? 4 : 28}" class="text-right">
                                    <div class="inline-block text-left w-[230px]">Wali Kelas &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: Ahmad Zulfikar, S.Pd.</div>
                                </th>
                            </tr>
                            <tr class="spacer-row"><th colspan="${totalCols + 2}"></th></tr>
                            
                            <tr>
                                <th rowspan="2" class="text-center rounded-tl-md">No</th>
                                <th rowspan="1" class="text-left pl-2">NAMA SISWA</th>
                                <th colspan="${totalCols}" class="text-center rounded-tr-md">${id === 'presensi' ? 'TANGGAL' : 'PERTEMUAN'}</th>
                            </tr>
                            <tr>
                                <th class="text-left pl-2 border-t border-slate-200">${id === 'presensi' ? 'KETERANGAN' : 'TANGGAL'}</th>
            `;

            if (isKeuangan) {
                const dates = ['07/07/26', '14/07/26', '21/07/26', '28/07/26', 'JUMLAH'];
                dates.forEach(d => {
                    html += `<th class="text-center border-t border-slate-200 py-1 text-[11px]">${d}</th>`;
                });
            } else {
                for (let i = 1; i <= MAX_COLS; i++) {
                    let isSunday = [5, 12, 19, 26].includes(i);
                    html += `<th class="text-center border-t border-slate-200 ${isSunday ? 'bg-red-100 text-red-600 border-b-red-200' : ''}">${i}</th>`;
                }
            }

            html += `
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            let totalKeuanganKelas = 0;

            if (students && students.length > 0) {
                students.forEach((name, index) => {
                    const isLastRow = index === students.length - 1;
                    html += `
                        <tr class="transition-colors">
                            <td class="student-no ${isLastRow && !isKeuangan ? 'rounded-bl-md' : ''}">${index + 1}</td>
                            <td class="student-name pl-2" title="${name}">${name}</td>
                    `;
                    
                    if (isKeuangan) {
                        // 07/07
                        if (index === 0) {
                            html += `<td rowspan="${students.length}" class="holiday-cell relative p-0 border-slate-200 bg-slate-50"><div class="absolute inset-0 flex items-center justify-center z-10"><span class="holiday-overlay font-bold text-slate-500 text-[10px] tracking-[0.3em] whitespace-nowrap overflow-visible">LIBUR TAHUN AJARAN BARU</span></div></td>`;
                        }
                        // 14/07
                        if (index === 0) {
                            html += `<td rowspan="${students.length}" class="holiday-cell relative p-0 border-slate-200 bg-teal-50"><div class="absolute inset-0 flex items-center justify-center z-10"><span class="holiday-overlay font-bold text-teal-600 text-[10px] tracking-[0.3em] whitespace-nowrap overflow-visible">KEGIATAN MATAMUDA</span></div></td>`;
                        }
                        // 21/07
                        html += `<td class="text-center text-[11px] text-slate-700 font-medium border-slate-200">2.000</td>`;
                        // 28/07
                        html += `<td class="text-center text-[11px] text-slate-700 border-slate-200"></td>`;
                        // Jumlah
                        html += `<td class="text-center text-[11px] font-bold text-teal-700 border-slate-200 ${isLastRow ? 'rounded-br-md' : ''}">2.000</td>`;
                        
                        totalKeuanganKelas += 2000;
                    } else {
                        for (let i = 1; i <= MAX_COLS; i++) {
                            let isSunday = [5, 12, 19, 26].includes(i);
                            let cellBg = isSunday ? 'background-color: #fee2e2;' : '';
                            let tdClass = isSunday ? 'border-red-200 holiday-cell' : '';
                            
                            // Libur Tahun Ajaran Baru (1-12)
                            if (i >= 1 && i <= 12) {
                                if (index === 0) {
                                    html += `<td rowspan="${students.length}" class="holiday-cell relative p-0 border-slate-200" style="${cellBg}">
                                        ${i === 6 ? '<div class="absolute inset-0 flex items-center justify-center z-10"><span class="holiday-overlay font-bold text-slate-500 text-[10px] tracking-[0.3em] whitespace-nowrap overflow-visible">LIBUR TAHUN AJARAN BARU</span></div>' : ''}
                                    </td>`;
                                }
                            } 
                            // Kegiatan MATAMUDA (13-18)
                            else if (i >= 13 && i <= 18) {
                                if (index === 0) {
                                    html += `<td rowspan="${students.length}" class="holiday-cell relative p-0 border-slate-200" style="${cellBg}">
                                        ${i === 15 ? '<div class="absolute inset-0 flex items-center justify-center z-10"><span class="holiday-overlay font-bold text-teal-600 text-[10px] tracking-[0.3em] whitespace-nowrap overflow-visible">KEGIATAN MATAMUDA</span></div>' : ''}
                                    </td>`;
                                }
                            } 
                            // Normal days
                            else {
                                let cellContent = '';
                                const n = name.toLowerCase();
                                if (id === 'presensi') {
                                    if (i >= 20 && i <= 25) {
                                        if (n.includes('alvin')) {
                                            cellContent = '<span class="text-blue-600 font-bold">S</span>';
                                        } else if (n.includes('rizky akbar') && i === 25) {
                                            cellContent = '<span class="text-blue-600 font-bold">S</span>';
                                        } else {
                                            cellContent = '<i class="fa-solid fa-check text-teal-600"></i>';
                                        }
                                    } else if (i === 27) {
                                        if (n.includes('jastra') || n.includes('anggika') || n.includes('nufah') || n.includes('diah') || n.includes('atika')) {
                                            cellContent = '<span class="text-blue-600 font-bold">S</span>';
                                        } else {
                                            cellContent = '<i class="fa-solid fa-check text-teal-600"></i>';
                                        }
                                    }
                                }
                                
                                html += `
                                    <td class="p-0 ${tdClass} ${isLastRow && i === MAX_COLS ? 'rounded-br-md' : ''}" style="${cellBg}">
                                        <div class="w-full h-full min-h-[22px] flex items-center justify-center text-[11px]">${cellContent}</div>
                                    </td>
                                `;
                            }
                        }
                    }
                    html += `</tr>`;
                });
                
                if (isKeuangan) {
                    html += `
                        <tr class="bg-slate-100 border-t border-slate-300">
                            <td colspan="6" class="text-right pr-4 py-2 rounded-bl-md text-slate-700 text-[11px] font-bold tracking-wide border-t border-slate-300">JUMLAH SATU KELAS</td>
                            <td class="text-center text-[12px] font-bold text-teal-700 py-2 rounded-br-md border-l border-t border-slate-300">Rp ${(totalKeuanganKelas).toLocaleString('id-ID')}</td>
                        </tr>
                    `;
                }
            } else {
                html += `
                    <tr>
                        <td colspan="${MAX_COLS + 2}" class="text-center text-red-500 py-6 font-sans border-0">
                            Gagal memuat data siswa.
                        </td>
                    </tr>
                `;
            }

            html += `
                        </tbody>
                    </table>
                </div>
            `;
            return html;
        }

        // Initialize
        const container = document.getElementById('table-container');
        const tabsContainer = document.getElementById('tabs');
        
        tabsContainer.innerHTML = `
            <button onclick="window.showTab('presensi')" id="tab-presensi" class="px-5 py-2 font-semibold rounded-lg shadow-sm font-sans transition-colors whitespace-nowrap bg-teal-600 text-white border border-teal-700 text-sm">Presensi</button>
            <button onclick="window.showTab('tabungan')" id="tab-tabungan" class="px-5 py-2 font-semibold rounded-lg shadow-sm font-sans transition-colors whitespace-nowrap bg-white text-slate-600 hover:bg-slate-50 border border-slate-300 text-sm">Tabungan</button>
            <button onclick="window.showTab('infaq')" id="tab-infaq" class="px-5 py-2 font-semibold rounded-lg shadow-sm font-sans transition-colors whitespace-nowrap bg-white text-slate-600 hover:bg-slate-50 border border-slate-300 text-sm">Infaq</button>
        `;

        const students7A = dataSiswa["7A"];
        container.innerHTML += createTableHTML('presensi', 'Presensi Siswa Dalam Kegiatan Belajar Mengajar', students7A);
        container.innerHTML += createTableHTML('tabungan', 'Rekapitulasi Tabungan Siswa Semester Gasal', students7A);
        container.innerHTML += createTableHTML('infaq', 'Rekapitulasi Infaq Siswa Semester Gasal', students7A);

        window.showTab('presensi');
    </script>
</body>
</html>
